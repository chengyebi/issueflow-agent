services:
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/issueflow
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/issueflow
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - REVIEW_ADMIN_TOKEN=${REVIEW_ADMIN_TOKEN:-}

      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - CHAT_MODEL=${CHAT_MODEL}
      - AGENT_MODE=${AGENT_MODE:-workflow}
      - PROMPT_VERSION=${PROMPT_VERSION:-triage-v2}
      - AGENT_VERSION=${AGENT_VERSION:-workflow-v2}
      - LLM_INPUT_COST_PER_MILLION_USD=${LLM_INPUT_COST_PER_MILLION_USD:-}
      - LLM_OUTPUT_COST_PER_MILLION_USD=${LLM_OUTPUT_COST_PER_MILLION_USD:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-384}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
      - EMBEDDING_QUERY_PREFIX=${EMBEDDING_QUERY_PREFIX:-}
      - EMBEDDING_CACHE_DIR=/var/cache/issueflow/fastembed
      - EMBEDDING_LOCAL_FILES_ONLY=${EMBEDDING_LOCAL_FILES_ONLY:-false}
      - EMBEDDING_CHUNK_SIZE=${EMBEDDING_CHUNK_SIZE:-384}
      - EMBEDDING_CHUNK_OVERLAP=${EMBEDDING_CHUNK_OVERLAP:-64}
      - EMBEDDING_MAX_CHUNKS=${EMBEDDING_MAX_CHUNKS:-16}
      - EVAL_REPOS=${EVAL_REPOS:-microsoft/vscode,nodejs/node,rust-lang/rust}
      - EVAL_CORPUS_LIMIT_PER_REPO=${EVAL_CORPUS_LIMIT_PER_REPO:-2000}
      - EVAL_QUERY_LIMIT_PER_REPO=${EVAL_QUERY_LIMIT_PER_REPO:-50}

    volumes:
      - fastembed_cache:/var/cache/issueflow/fastembed

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: sh -lc 'rq worker issueflow --url "$$REDIS_URL"'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/issueflow
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - CHAT_MODEL=${CHAT_MODEL}
      - AGENT_MODE=${AGENT_MODE:-workflow}
      - PROMPT_VERSION=${PROMPT_VERSION:-triage-v2}
      - AGENT_VERSION=${AGENT_VERSION:-workflow-v2}
      - RQ_MAX_RETRIES=${RQ_MAX_RETRIES:-2}
      - RQ_RETRY_INTERVALS=${RQ_RETRY_INTERVALS:-10,30}
      - LLM_INPUT_COST_PER_MILLION_USD=${LLM_INPUT_COST_PER_MILLION_USD:-}
      - LLM_OUTPUT_COST_PER_MILLION_USD=${LLM_OUTPUT_COST_PER_MILLION_USD:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-fastembed}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-384}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WRITE_ENABLED=${GITHUB_WRITE_ENABLED:-false}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
      - EMBEDDING_QUERY_PREFIX=${EMBEDDING_QUERY_PREFIX:-}
      - EMBEDDING_CACHE_DIR=/var/cache/issueflow/fastembed
      - EMBEDDING_LOCAL_FILES_ONLY=${EMBEDDING_LOCAL_FILES_ONLY:-false}
      - EMBEDDING_CHUNK_SIZE=${EMBEDDING_CHUNK_SIZE:-384}
      - EMBEDDING_CHUNK_OVERLAP=${EMBEDDING_CHUNK_OVERLAP:-64}
      - EMBEDDING_MAX_CHUNKS=${EMBEDDING_MAX_CHUNKS:-16}
      - EVAL_REPOS=${EVAL_REPOS:-microsoft/vscode,nodejs/node,rust-lang/rust}
      - EVAL_CORPUS_LIMIT_PER_REPO=${EVAL_CORPUS_LIMIT_PER_REPO:-2000}
      - EVAL_QUERY_LIMIT_PER_REPO=${EVAL_QUERY_LIMIT_PER_REPO:-50}
    volumes:
      - fastembed_cache:/var/cache/issueflow/fastembed
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=issueflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d issueflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  fastembed_cache:
